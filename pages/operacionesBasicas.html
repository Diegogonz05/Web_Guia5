<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones básicas | Guía 5 — Diego González</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="../css/style.css" rel="stylesheet">

<body>

        <h1>Operaciones básicas con JavaScript</h1>
        <div class="text-center text-secondary mb-3">Ejemplo 4: selecciona una operación e ingresa dos números. Para los decimales, utiliza el punto.</div>
        <div class="flex-container">
            <button type="button" id="idBtnSumar" class="flex-grow-1 h-auto py-2">Sumar</button>
            <button type="button" id="idBtnRestar" class="flex-grow-1 h-auto py-2">Restar</button>
            <button type="button" id="idBtnMultiplicar" class="flex-grow-1 h-auto py-2">Multiplicar</button>
            <button type="button" id="idBtnDividir" class="flex-grow-1 h-auto py-2">Dividir</button>
        </div>
        <h2 class="h4 mt-3">Resultado</h2>
        <p id="idParrafo" class="text-break" role="status">Aquí se mostrará el resultado de la operación.</p>
        <noscript><div class="alert alert-warning">Activa JavaScript para realizar operaciones.</div></noscript>
        <nav aria-label="Regresar a la guía">
